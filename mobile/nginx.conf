# Nginx vhost for SkillFlow Flutter Web (served from /usr/share/nginx/html).
# Used by mobile/Dockerfile.web. Routing follows Flutter's PathUrlStrategy:
# unknown paths fall back to /index.html so the app can resolve them itself.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default charset + a few hardening headers. CSP is intentionally not set
    # here because Flutter Web ships eval'd code (CanvasKit, deferred chunks);
    # tighten it later only after auditing the produced bundle.
    charset utf-8;
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # SPA fallback: any non-asset route resolves to /index.html so Flutter
    # router can take over.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html and the service worker MUST NOT be cached by the browser, or
    # users will be stuck on a stale main.dart.js after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
    }

    # Flutter ships its assets and CanvasKit under deterministic folders. Cache
    # them for a week — the service worker handles invalidation across deploys.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location /canvaskit/ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # gzip is enough for text-based payloads. main.dart.js compresses ~4x.
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Lightweight liveness endpoint used by Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
