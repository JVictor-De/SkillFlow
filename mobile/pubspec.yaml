name: skillflow_app
description: App SkillFlow para Alunos e Responsáveis (Flutter offline-first).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  http: ^1.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
